<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Amar To-Do List</title>
  <style>
    body { font-family: Arial; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
    h1 { color: #00ff88; }
    input, button { padding: 10px; margin: 5px; border-radius: 8px; border: none; }
    button { background: #00ff88; color: black; font-weight: bold; cursor: pointer; }
    li { list-style: none; margin: 10px auto; background: #333; padding: 10px; border-radius: 8px; width: 80%; }
  </style>
</head>
<body>
  <h1>🔥 BOS ER TO-DO LIST 🔥</h1>
  <input type="text" id="task" placeholder="Ki kaj ache?">
  <button onclick="addTask()">Add</button>
  <ul id="list"></ul>

  <script>
    function addTask() {
      let task = document.getElementById("task").value;
      if(task == "") return;
      let li = document.createElement("li");
      li.innerHTML = task + " <button onclick='this.parentNode.remove()'>Done ✅</button>";
      document.getElementById("list").appendChild(li);
      document.getElementById("task").value = "";
    }
  </script>
</body>
</html>
